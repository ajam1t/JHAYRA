<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Cream background matching JHAYRA brand -->
  <rect width="512" height="512" fill="#FAF7F0"/>
  <!-- Thin gold border ring -->
  <rect x="12" y="12" width="488" height="488" fill="none" stroke="#B68D40" stroke-width="7" opacity="0.7"/>
  <!-- JH monogram in brand dark colour -->
  <text
    x="256"
    y="328"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="272"
    font-weight="700"
    fill="#1A1208"
    text-anchor="middle"
    dominant-baseline="alphabetic"
    letter-spacing="-8"
  >JH</text>
  <!-- Gold crossbar accent — represents the gold H-crossbar element from the logo -->
  <rect x="260" y="180" width="148" height="13" rx="3" fill="#B68D40"/>
  <!-- Gold botanical dot cluster — represents the leaf/floral detail -->
  <ellipse cx="256" cy="100" rx="7" ry="11" fill="#B68D40"/>
  <ellipse cx="244" cy="112" rx="5" ry="8" fill="#B68D40" transform="rotate(-18 244 112)"/>
  <ellipse cx="268" cy="112" rx="5" ry="8" fill="#B68D40" transform="rotate(18 268 112)"/>
  <!-- Thin gold rule below text (brand divider element) -->
  <rect x="176" y="360" width="160" height="7" rx="3.5" fill="#B68D40" opacity="0.85"/>
</svg>
